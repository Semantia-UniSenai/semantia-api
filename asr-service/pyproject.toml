[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "semantia-asr"
version = "0.1.0"
description = "CPU-first ephemeral ASR service for Semantia"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "faster-whisper==1.2.1",
  "numpy==2.4.6",
  "uvicorn[standard]==0.52.1",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["asr_service"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
