# Render Blueprint for the Semantia API.
# Deploy: push to a repo, then "New > Blueprint" in Render and point it here.
services:
  - type: web
    name: semantia-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm i && pnpm prisma generate && pnpm build
    startCommand: pnpm prisma migrate deploy && node dist/main
    healthCheckPath: /api/health
    envVars:
      # Connection string for the managed Postgres below (auto-wired by Render).
      - key: DATABASE_URL
        fromDatabase:
          name: semantia-db
          property: connectionString
      # JWT signing secret — generated once by Render and kept stable.
      - key: JWT_SECRET
        generateValue: true
      # Lock this down to the deployed frontend origin for production.
      - key: CORS_ORIGIN
        value: '*'
      - key: NODE_VERSION
        value: '22'

databases:
  - name: semantia-db
    databaseName: semantia
    user: semantia
    plan: free
